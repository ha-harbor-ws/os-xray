[start]
# v3.0.0: %1 = inst_uuid (опционально; если не указан — запускает все инстансы)
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:start %s
type:script_output
message:Starting Xray

[stop]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:stop %s
type:script_output
message:Stopping Xray

[restart]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:restart %s
type:script_output
message:Restarting Xray

[reconfigure]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:reconfigure %s
type:script_output
message:Reconfiguring Xray

[status]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:status %s
type:script_output
message:Xray status

[statusall]
# v3.0.0: статус всех инстансов в формате JSON {inst_uuid: {status, xray_core, tun2socks}}
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:statusall
type:script_output
message:Xray status all instances

[log]
command:/usr/bin/tail
parameters:-n 150 /tmp/xray_syshook.log
type:script_output
message:Xray log

[xraylog]
# Per-instance лог: UUID передаётся как %1, скрипт выбирает нужный файл.
command:/usr/local/opnsense/scripts/Xray/xray-log.php
parameters:%s
type:script_output
message:Xray core log

[birdlog]
command:/usr/local/opnsense/scripts/Xray/xray-bird-log.php
type:script_output
message:BIRD log

[birdloglevel]
command:/usr/local/opnsense/scripts/Xray/xray-bird-loglevel.php
parameters:%s
type:script_output
message:BIRD syslog log class

[testconnect]
# BUG-4 FIX: порт читается из config.xml через PHP-скрипт.
command:/usr/local/opnsense/scripts/Xray/xray-testconnect.php
parameters:%s
type:script_output
message:Xray test connection

[validate]
# E5: сухой прогон конфига без применения.
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:validate %s
type:script_output
message:Validate Xray config

[ifstats]
# E4: статистика TUN-интерфейса для панели Diagnostics.
command:/usr/local/opnsense/scripts/Xray/xray-ifstats.php
parameters:%s
type:script_output
message:Xray TUN interface stats

[version]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:version
type:script_output
message:Xray plugin version

[delete]
# v3.1.0: stop instance, destroy TUN and remove per-instance files before delItem
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:delete %s
type:script_output
message:Delete Xray instance resources

[watchdog]
# E1: watchdog — запускается cron каждую минуту, итерирует все инстансы.
command:/usr/local/opnsense/scripts/Xray/xray-watchdog.php
parameters:
type:script_output
message:Xray watchdog check

[birdactivetun]
command:/usr/local/opnsense/scripts/Xray/xray-bird-active-tun.php
parameters:
type:script_output
message:Select active tun2socks for BIRD

[birdautoroute]
command:/usr/local/opnsense/scripts/Xray/xray-bird-active-tun.php
parameters:autoroute
type:script_output
message:Auto route tun2socks poll

[birdsync]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:birdsync
type:script_output
message:Sync BIRD with tun2socks state

[bgpwrite]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:bgpwrite
type:script_output
message:Write BIRD BGP peer includes

[bgprestart]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:bgprestart
type:script_output
message:Rewrite BGP peers and restart BIRD

[bgpstatus]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:bgpstatus
type:script_output
message:BIRD BGP peer status

[dnstapconf]
command:/usr/local/opnsense/scripts/Xray/xray-dnstap-conf.php
parameters:get
type:script_output
message:Read dnstap-bgp config files

[dnstapwrite]
command:/usr/local/opnsense/scripts/Xray/xray-dnstap-conf.php
parameters:write
type:script_output
message:Write dnstap-bgp config files

[dnstapstart]
command:/usr/local/opnsense/scripts/Xray/xray-dnstap-conf.php
parameters:start
type:script_output
message:Enable Unbound DNSTap include and start dnstap-bgp

[dnstapstop]
command:/usr/local/opnsense/scripts/Xray/xray-dnstap-conf.php
parameters:stop
type:script_output
message:Stop dnstap-bgp and remove Unbound DNSTap include
