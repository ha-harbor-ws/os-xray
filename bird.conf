log syslog { warning };

include "/usr/local/etc/bird/active_tun_v4.inc";
include "/usr/local/etc/bird/active_tun_v6.inc";
include "/usr/local/etc/bird/wan_if.inc";
include "/usr/local/etc/bird/communities.inc";
include "/usr/local/etc/bird/filters.inc";
include "/usr/local/etc/bird/router_id.inc";


# router id is set in router_id.inc from WAN IPv4 at install

protocol device {
    scan time 300;
}

protocol direct {
    ipv4;
    ipv6;
    include "/usr/local/etc/bird/direct_ifs.inc";
}

protocol kernel krt4 {
    scan time 60;
    persist;
    learn;
    ipv4 {
        import none;
        export all;
    };
}

protocol kernel krt6 {
    scan time 60;
    persist;
    learn;
    ipv6 {
        import none;
        export all;
    };
}

# Prefix lists (one prefix per line, comma except last) in routes_static_v{4,6}_{PROXY,DIRECT,BLOCK}.inc
# define must be top-level; include must start at column 0 and end with ;
define NETS_PROXY_V4 = [
include "/usr/local/etc/bird/routes_static_v4_PROXY.inc";
];
define NETS_DIRECT_V4 = [
include "/usr/local/etc/bird/routes_static_v4_DIRECT.inc";
];
define NETS_BLOCK_V4 = [
include "/usr/local/etc/bird/routes_static_v4_BLOCK.inc";
];
define NETS_PROXY_V6 = [
include "/usr/local/etc/bird/routes_static_v6_PROXY.inc";
];
define NETS_DIRECT_V6 = [
include "/usr/local/etc/bird/routes_static_v6_DIRECT.inc";
];
define NETS_BLOCK_V6 = [
include "/usr/local/etc/bird/routes_static_v6_BLOCK.inc";
];

protocol static static_v4 {
    ipv4;
    for net n in NETS_PROXY_V4 do {
        route n via ACTIVE_TUN4_IF;
    }
    for net n in NETS_DIRECT_V4 do {
        route n via IPv4_GATEWAY;
    }
    for net n in NETS_BLOCK_V4 do {
        route n blackhole;
    }
}

protocol static static_v6 {
    ipv6;
    for net n in NETS_PROXY_V6 do {
        route n via ACTIVE_TUN6_IF;
    }
    for net n in NETS_DIRECT_V6 do {
        route n via IPv6_GATEWAY;
    }
    for net n in NETS_BLOCK_V6 do {
        route n blackhole;
    }
}

include "/usr/local/etc/bird/bgp.conf";
