log syslog { warning };

include "/usr/local/etc/bird/active_tun_v4.inc";
include "/usr/local/etc/bird/active_tun_v6.inc";
include "/usr/local/etc/bird/wan_if.inc";
include "/usr/local/etc/bird/communities.inc";
include "/usr/local/etc/bird/filters.inc";
include "/usr/local/etc/bird/router_id.inc";


# router id is set in router_id.inc from WAN IPv4 at install

protocol device {
    scan time 300;
}

protocol direct {
    ipv4;
    ipv6;
    include "/usr/local/etc/bird/direct_ifs.inc";
}

protocol kernel krt4 {
    scan time 60;
    persist;
    learn;
    ipv4 {
        import none;
        export all;
    };
}

protocol kernel krt6 {
    scan time 60;
    persist;
    learn;
    ipv6 {
        import none;
        export all;
    };
}

# Final routes built by os-xray from intermediate prefix sources → *_apply.inc
# include must start at column 0.
protocol static static_v4 {
    ipv4;
include "/usr/local/etc/bird/routes_static_v4_apply.inc";
}

protocol static static_v6 {
    ipv6;
include "/usr/local/etc/bird/routes_static_v6_apply.inc";
}

include "/usr/local/etc/bird/bgp.conf";
